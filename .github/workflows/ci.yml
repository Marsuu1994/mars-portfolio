# Adapted from mars-workbench@3f741cc .github/workflows/ci.yml: no Prisma, no
# Postgres, no integration or component jobs; the spec-coverage job from
# mars-workbench@368bed5, with no legacy docs to compare with main.
name: CI
on: push
jobs:
  format:
    name: Prettier (Google style)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node and dependencies
        uses: ./.github/actions/setup
      - name: Check formatting
        run: npm run format:check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node and dependencies
        uses: ./.github/actions/setup
      - name: Lint
        run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node and dependencies
        uses: ./.github/actions/setup
      - name: Typecheck
        run: npm run typecheck

  knip:
    name: Unused code (knip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node and dependencies
        uses: ./.github/actions/setup
      - name: Find unused files, exports and dependencies
        run: npm run knip

  themes:
    name: Theme variable contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'false'
      # Dependency-free script: every theme must declare the same CSS
      # custom properties (see AGENTS.md → Themes).
      - name: Check theme variables
        run: npm run check:themes

  spec:
    name: Spec coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'false'
      # Dependency-free script, run by Node: every spec item is held by a test
      # that names it (design/specs/README.md › Items and IDs).
      - name: Check spec coverage
        run: npm run check:spec

  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node and dependencies
        uses: ./.github/actions/setup
      - name: Run unit tests
        run: npm test

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node and dependencies
        uses: ./.github/actions/setup
      - name: Chromium
        uses: ./.github/actions/chromium
      # Builds and starts production, then runs every page at both widths and
      # in both themes.
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
